<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 500" font-family="system-ui, sans-serif">
  <title>A beach seen from above</title>
  <!-- sea -->
  <rect width="800" height="500" fill="#4fb3e0"/>
  <path d="M0 0 H800 V170 C 700 150, 620 200, 520 180 S 330 140, 230 175 S 60 160, 0 185 Z" fill="#3a9fd0"/>
  <!-- sand -->
  <path d="M0 260 C 100 230, 200 270, 320 245 S 560 215, 660 250 S 760 240, 800 230 V500 H0 Z" fill="#f4dfa4"/>
  <!-- wet sand + foam -->
  <path d="M0 260 C 100 230, 200 270, 320 245 S 560 215, 660 250 S 760 240, 800 230" fill="none" stroke="#e7cd86" stroke-width="22"/>
  <path d="M0 250 C 100 220, 200 260, 320 235 S 560 205, 660 240 S 760 230, 800 220" fill="none" stroke="#fff" stroke-width="6" stroke-linecap="round" opacity="0.85"/>
  <!-- waves -->
  <g fill="none" stroke="#bfe6f7" stroke-width="4" stroke-linecap="round" opacity="0.8">
    <path d="M60 110 q20 -12 40 0 t40 0"/><path d="M360 70 q20 -12 40 0 t40 0"/><path d="M620 120 q20 -12 40 0 t40 0"/><path d="M220 200 q20 -12 40 0"/>
  </g>
  <!-- surfer -->
  <g transform="translate(470 120) rotate(-20)"><ellipse rx="26" ry="7" fill="#ffd23f"/><circle cx="2" r="6" fill="#7a4a2a"/></g>
  <!-- swimmer -->
  <g transform="translate(160 150)"><circle r="6" fill="#c68a5a"/><path d="M-12 4 q12 8 24 0" stroke="#fff" stroke-width="2" fill="none"/></g>
  <!-- pier -->
  <rect x="690" y="40" width="34" height="220" fill="#a87b4f"/>
  <g stroke="#8a6239" stroke-width="2"><line x1="690" y1="70" x2="724" y2="70"/><line x1="690" y1="110" x2="724" y2="110"/><line x1="690" y1="150" x2="724" y2="150"/><line x1="690" y1="190" x2="724" y2="190"/><line x1="690" y1="230" x2="724" y2="230"/></g>
  <!-- umbrellas -->
  <g>
    <circle cx="150" cy="330" r="38" fill="#e85d5d"/><path d="M150 292 V368 M112 330 H188 M123 303 L177 357 M177 303 L123 357" stroke="#fff" stroke-width="5"/><circle cx="150" cy="330" r="5" fill="#fff"/>
    <circle cx="420" cy="320" r="34" fill="#3a7bd5"/><path d="M420 286 V354 M386 320 H454 M396 296 L444 344 M444 296 L396 344" stroke="#ffd23f" stroke-width="5"/><circle cx="420" cy="320" r="5" fill="#ffd23f"/>
  </g>
  <!-- towels -->
  <g transform="rotate(8 220 400)"><rect x="200" y="370" width="38" height="70" rx="3" fill="#7a4fd1"/><g fill="#fff" opacity="0.6"><rect x="200" y="385" width="38" height="6"/><rect x="200" y="420" width="38" height="6"/></g></g>
  <g transform="rotate(-6 480 400)"><rect x="462" y="365" width="38" height="70" rx="3" fill="#2fbf8f"/><g fill="#fff" opacity="0.6"><rect x="472" y="365" width="6" height="70"/><rect x="486" y="365" width="6" height="70"/></g></g>
  <!-- volleyball -->
  <rect x="560" y="300" width="160" height="110" fill="none" stroke="#fff" stroke-width="3" stroke-dasharray="8 6"/>
  <line x1="640" y1="292" x2="640" y2="418" stroke="#444" stroke-width="5"/>
  <circle cx="600" cy="360" r="8" fill="#fff" stroke="#f5c542" stroke-width="3"/>
  <!-- lifeguard tower -->
  <g transform="translate(320 300)"><rect x="-22" y="-22" width="44" height="44" fill="#e85d5d"/><rect x="-14" y="-14" width="28" height="28" fill="#fff"/><path d="M-10 -10 L10 10 M10 -10 L-10 10" stroke="#e85d5d" stroke-width="4"/></g>
  <!-- sandcastle -->
  <g transform="translate(90 440)"><rect x="-26" y="-10" width="52" height="24" fill="#d9b860"/><rect x="-30" y="-24" width="16" height="16" fill="#e2c46e"/><rect x="14" y="-24" width="16" height="16" fill="#e2c46e"/><rect x="-8" y="-30" width="16" height="22" fill="#e2c46e"/><path d="M0 -30 v-12 l10 4 -10 4" stroke="#555" stroke-width="2" fill="#e85d5d"/></g>
  <!-- ice cream stand -->
  <g transform="translate(330 430)"><rect x="-34" y="-20" width="68" height="40" rx="5" fill="#fff" stroke="#bbb" stroke-width="2"/><rect x="-34" y="-20" width="68" height="12" fill="#ff7eb6"/><circle cx="-12" cy="6" r="7" fill="#ffd1e6"/><circle cx="6" cy="6" r="7" fill="#c8f0d8"/><circle cx="22" cy="6" r="6" fill="#fff1b8"/></g>
  <!-- labels -->
  <g font-size="13" font-weight="700" fill="#5a4320" opacity="0.75" text-anchor="middle">
    <text x="640" y="434">Volleyball</text><text x="330" y="474">Ice cream</text><text x="90" y="478">Sandcastle</text><text x="320" y="342">Lifeguard</text>
  </g>
  <g font-size="13" font-weight="700" fill="#fff" opacity="0.9" text-anchor="middle">
    <text x="470" y="150">Surfing</text><text x="160" y="178">Swimming</text><text x="707" y="30">Pier</text>
  </g>
</svg>
