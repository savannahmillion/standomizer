<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 500" font-family="system-ui, sans-serif">
  <title>A park seen from above</title>
  <!-- grass -->
  <rect width="800" height="500" fill="#9fd88a"/>
  <g fill="#93cf7e" opacity="0.7">
    <circle cx="120" cy="420" r="60"/><circle cx="700" cy="90" r="70"/><circle cx="430" cy="470" r="50"/>
  </g>
  <!-- winding path -->
  <path d="M-10 300 C 120 260, 200 360, 330 300 S 520 180, 640 250 S 760 330, 810 290" fill="none" stroke="#e9d8b4" stroke-width="34" stroke-linecap="round"/>
  <path d="M330 300 C 340 380, 300 440, 320 510" fill="none" stroke="#e9d8b4" stroke-width="26" stroke-linecap="round"/>
  <!-- pond -->
  <path d="M470 330 C 520 300, 640 310, 660 360 C 680 420, 600 460, 530 450 C 460 440, 430 370, 470 330 Z" fill="#7cc4e8"/>
  <path d="M490 345 C 530 325, 620 330, 640 365" fill="none" stroke="#a9dcf3" stroke-width="5" stroke-linecap="round"/>
  <g><ellipse cx="560" cy="395" rx="11" ry="7" fill="#fff"/><circle cx="569" cy="390" r="5" fill="#2f8f4e"/><path d="M573 390 l6 1 -6 2z" fill="#f2a33a"/></g>
  <g><ellipse cx="595" cy="415" rx="9" ry="6" fill="#fff"/><circle cx="602" cy="411" r="4" fill="#fff"/><path d="M605 411 l5 1 -5 2z" fill="#f2a33a"/></g>
  <!-- trees -->
  <g>
    <circle cx="80" cy="90" r="38" fill="#4e9f4a"/><circle cx="60" cy="75" r="22" fill="#62b35d"/>
    <circle cx="170" cy="60" r="30" fill="#4e9f4a"/><circle cx="158" cy="50" r="16" fill="#62b35d"/>
    <circle cx="720" cy="430" r="40" fill="#4e9f4a"/><circle cx="702" cy="416" r="22" fill="#62b35d"/>
    <circle cx="400" cy="70" r="28" fill="#4e9f4a"/><circle cx="390" cy="60" r="14" fill="#62b35d"/>
    <circle cx="760" cy="200" r="26" fill="#4e9f4a"/>
    <circle cx="40" cy="220" r="26" fill="#4e9f4a"/>
  </g>
  <!-- playground: sandbox + slide + swings -->
  <rect x="210" y="105" width="130" height="95" rx="10" fill="#f3dc9b" stroke="#d9bf72" stroke-width="4"/>
  <rect x="226" y="120" width="34" height="60" rx="4" fill="#e85d5d"/>
  <rect x="232" y="128" width="22" height="44" rx="3" fill="#f7a1a1"/>
  <line x1="280" y1="120" x2="325" y2="120" stroke="#6b5a3a" stroke-width="5"/>
  <line x1="290" y1="120" x2="290" y2="150" stroke="#888" stroke-width="2"/><rect x="284" y="150" width="12" height="5" fill="#3a7bd5"/>
  <line x1="315" y1="120" x2="315" y2="150" stroke="#888" stroke-width="2"/><rect x="309" y="150" width="12" height="5" fill="#3a7bd5"/>
  <circle cx="300" cy="180" r="9" fill="#f5c542"/>
  <!-- picnic blanket -->
  <g transform="rotate(-12 170 360)">
    <rect x="125" y="325" width="90" height="70" fill="#fff"/>
    <g fill="#e85d5d"><rect x="125" y="325" width="15" height="70"/><rect x="155" y="325" width="15" height="70"/><rect x="185" y="325" width="15" height="70"/></g>
    <g fill="#e85d5d" opacity="0.5"><rect x="125" y="335" width="90" height="12"/><rect x="125" y="363" width="90" height="12"/></g>
    <circle cx="160" cy="360" r="10" fill="#c98b4a"/><rect x="185" y="345" width="16" height="10" rx="2" fill="#7a4fd1"/>
  </g>
  <!-- soccer field -->
  <rect x="470" y="80" width="200" height="130" fill="#7fc96b" stroke="#fff" stroke-width="4"/>
  <line x1="570" y1="80" x2="570" y2="210" stroke="#fff" stroke-width="3"/>
  <circle cx="570" cy="145" r="22" fill="none" stroke="#fff" stroke-width="3"/>
  <rect x="470" y="120" width="20" height="50" fill="none" stroke="#fff" stroke-width="3"/>
  <rect x="650" y="120" width="20" height="50" fill="none" stroke="#fff" stroke-width="3"/>
  <circle cx="600" cy="130" r="5" fill="#fff" stroke="#333" stroke-width="1"/>
  <!-- benches -->
  <g fill="#8a6239"><rect x="380" y="235" width="44" height="10" rx="2"/><rect x="700" y="300" width="10" height="40" rx="2"/><rect x="90" y="250" width="44" height="10" rx="2"/></g>
  <!-- food cart -->
  <g transform="translate(395 360)">
    <rect width="54" height="34" rx="4" fill="#fff" stroke="#999" stroke-width="2"/>
    <path d="M-6 0 h66 l-8 -14 h-50 z" fill="#f5c542"/>
    <path d="M6 -14 l-4 14 M20 -14 l0 14 M34 -14 l4 14 M48 -14 l8 14" stroke="#e85d5d" stroke-width="6"/>
    <circle cx="12" cy="36" r="5" fill="#555"/><circle cx="42" cy="36" r="5" fill="#555"/>
  </g>
  <!-- flower beds -->
  <g>
    <ellipse cx="250" cy="455" rx="55" ry="22" fill="#7a5a3a"/>
    <g fill="#ff7eb6"><circle cx="220" cy="452" r="6"/><circle cx="250" cy="446" r="6"/><circle cx="280" cy="455" r="6"/></g>
    <g fill="#ffd23f"><circle cx="235" cy="462" r="5"/><circle cx="265" cy="462" r="5"/></g>
  </g>
  <!-- dog -->
  <g transform="translate(640 280)"><ellipse rx="12" ry="7" fill="#b07a45"/><circle cx="12" cy="-4" r="6" fill="#b07a45"/><path d="M-12 0 l-8 -6" stroke="#b07a45" stroke-width="3" stroke-linecap="round"/></g>
  <!-- labels -->
  <g font-size="13" font-weight="700" fill="#2e4d2a" opacity="0.75" text-anchor="middle">
    <text x="275" y="222">Playground</text><text x="570" y="232">Field</text><text x="560" y="482">Pond</text>
    <text x="170" y="415">Picnic</text><text x="422" y="420">Snacks</text><text x="250" y="492">Flowers</text>
  </g>
</svg>
