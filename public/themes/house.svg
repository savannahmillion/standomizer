<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 500" font-family="system-ui, sans-serif">
  <title>A house floor plan seen from above</title>
  <!-- garden -->
  <rect width="800" height="500" fill="#a8dc93"/>
  <g fill="#4e9f4a"><circle cx="40" cy="40" r="26"/><circle cx="760" cy="460" r="30"/><circle cx="770" cy="50" r="22"/></g>
  <!-- house outline -->
  <rect x="70" y="60" width="620" height="380" fill="#f7f1e6" stroke="#4a3f35" stroke-width="10"/>
  <!-- interior walls -->
  <g stroke="#4a3f35" stroke-width="6">
    <line x1="300" y1="60" x2="300" y2="200"/><line x1="300" y1="250" x2="300" y2="440"/>
    <line x1="70" y1="250" x2="140" y2="250"/><line x1="190" y1="250" x2="300" y2="250"/>
    <line x1="500" y1="60" x2="500" y2="150"/><line x1="500" y1="200" x2="500" y2="260"/>
    <line x1="500" y1="260" x2="560" y2="260"/><line x1="610" y1="260" x2="690" y2="260"/>
  </g>
  <!-- room floors -->
  <rect x="75" y="65" width="222" height="182" fill="#e9dcf7"/>   <!-- bedroom -->
  <rect x="75" y="253" width="222" height="182" fill="#dff0e8"/>  <!-- office -->
  <rect x="303" y="65" width="194" height="372" fill="#fbeedd"/>  <!-- living -->
  <rect x="503" y="65" width="182" height="192" fill="#e3f1fb"/>  <!-- bathroom -->
  <rect x="503" y="263" width="182" height="172" fill="#fff6d6"/> <!-- kitchen -->
  <!-- bed -->
  <rect x="110" y="95" width="120" height="130" rx="8" fill="#fff" stroke="#b9a6d9" stroke-width="3"/>
  <rect x="110" y="95" width="120" height="30" rx="8" fill="#cdb8f0"/>
  <rect x="120" y="100" width="45" height="20" rx="6" fill="#fff"/><rect x="175" y="100" width="45" height="20" rx="6" fill="#fff"/>
  <rect x="110" y="150" width="120" height="75" rx="4" fill="#9f86d6"/>
  <circle cx="255" cy="110" r="12" fill="#ffd23f" opacity="0.8"/>
  <!-- desk + chair + laptop -->
  <rect x="95" y="300" width="140" height="50" rx="4" fill="#c99d6b"/>
  <rect x="140" y="308" width="44" height="28" rx="3" fill="#555"/><rect x="144" y="312" width="36" height="20" fill="#8fd3ff"/>
  <circle cx="165" cy="378" r="18" fill="#3a7bd5"/>
  <circle cx="215" cy="318" r="8" fill="#e85d5d"/><text x="215" y="322" font-size="10" text-anchor="middle" fill="#fff">☕</text>
  <g><circle cx="260" cy="410" r="14" fill="#4e9f4a"/><rect x="252" y="408" width="16" height="16" fill="#c98b4a"/></g>
  <!-- couch + TV + rug -->
  <ellipse cx="400" cy="300" rx="80" ry="55" fill="#f2c5a0"/>
  <rect x="330" y="360" width="140" height="50" rx="12" fill="#e07a5f"/>
  <rect x="330" y="360" width="140" height="16" rx="8" fill="#c7604a"/>
  <rect x="345" y="95" width="110" height="14" rx="3" fill="#333"/>
  <rect x="375" y="270" width="50" height="30" rx="4" fill="#a87b4f"/>
  <circle cx="320" cy="90" r="14" fill="#4e9f4a"/>
  <!-- bathroom: tub, toilet, sink -->
  <rect x="520" y="85" width="70" height="140" rx="30" fill="#fff" stroke="#9cc7e0" stroke-width="4"/>
  <rect x="530" y="95" width="50" height="120" rx="22" fill="#bfe3f7"/>
  <g><rect x="625" y="90" width="40" height="18" rx="4" fill="#fff" stroke="#9cc7e0" stroke-width="3"/><ellipse cx="645" cy="128" rx="18" ry="22" fill="#fff" stroke="#9cc7e0" stroke-width="3"/></g>
  <ellipse cx="645" cy="210" rx="22" ry="16" fill="#fff" stroke="#9cc7e0" stroke-width="3"/>
  <!-- kitchen: counters, stove, fridge, table -->
  <rect x="503" y="400" width="182" height="35" fill="#d9c7a6"/>
  <rect x="650" y="263" width="35" height="172" fill="#d9c7a6"/>
  <g fill="#555"><circle cx="540" cy="417" r="9"/><circle cx="570" cy="417" r="9"/></g>
  <rect x="650" y="275" width="35" height="50" fill="#e8eef2" stroke="#aab" stroke-width="2"/>
  <circle cx="575" cy="330" r="34" fill="#c99d6b"/>
  <g fill="#8a6239"><circle cx="575" cy="285" r="10"/><circle cx="575" cy="375" r="10"/><circle cx="530" cy="330" r="10"/><circle cx="620" cy="330" r="10"/></g>
  <circle cx="575" cy="330" r="8" fill="#e85d5d"/>
  <!-- front door + porch -->
  <rect x="370" y="440" width="60" height="40" fill="#d9c7a6" stroke="#4a3f35" stroke-width="3"/>
  <rect x="385" y="434" width="30" height="12" fill="#a87b4f"/>
  <!-- labels -->
  <g font-size="14" font-weight="700" fill="#4a3f35" opacity="0.7" text-anchor="middle">
    <text x="186" y="242">Bedroom</text><text x="186" y="430">Home office</text><text x="400" y="200">Living room</text>
    <text x="594" y="250">Bathroom</text><text x="594" y="392">Kitchen</text><text x="400" y="495">Porch</text>
  </g>
  <text x="740" y="250" font-size="14" font-weight="700" fill="#2e4d2a" opacity="0.7" text-anchor="middle">Garden</text>
</svg>
